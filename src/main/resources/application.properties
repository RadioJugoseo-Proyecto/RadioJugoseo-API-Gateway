spring.application.name=api-gateway
server.port=8080

# ==========================================
# MICROSERVICIO DE USUARIOS - PUERTO 8081
# ==========================================

# Registro, login y renovación de JWT
spring.cloud.gateway.server.webmvc.routes[0].id=usuarios-auth
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/auth/**

# Gestión de usuarios
spring.cloud.gateway.server.webmvc.routes[1].id=usuarios-crud
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/usuarios/**

# ==========================================
# MICROSERVICIO DE PROGRAMAS - PUERTO 8082
# ==========================================

# Gestión de programas
spring.cloud.gateway.server.webmvc.routes[2].id=programas
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/programas/**

# Gestión de transmisiones
spring.cloud.gateway.server.webmvc.routes[3].id=transmisiones
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/transmisiones/**
